# Local/staging SaaS deployment for Industrial RFQ Intelligence.
# This file intentionally uses SQLite + development mode for reproducible local smoke tests.
# Production deployments must use docker-compose.saas.production.yml with managed PostgreSQL.
services:
  industrial-rfq-api:
    build:
      context: .
      dockerfile: Dockerfile.saas
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INDUSTRIAL_RFQ_ENV: development
      INDUSTRIAL_RFQ_DATABASE_URL: sqlite:////app/data/industrial_rfq.db
    volumes:
      - industrial-rfq-data:/app/data
    restart: unless-stopped
volumes:
  industrial-rfq-data:
