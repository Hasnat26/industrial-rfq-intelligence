[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "industrial-rfq-intelligence"
version = "0.1.0"
description = "Evidence-aware AI-assisted technical and commercial review for industrial RFQs and vendor quotations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Md. Abul Hasnat" }]
keywords = [
    "industrial-ai",
    "rfq",
    "quotation-analysis",
    "vendor-evaluation",
    "engineering",
    "epc",
    "industrial-automation",
    "procurement",
    "technical-compliance",
    "document-intelligence",
    "llm",
    "evidence-traceability",
    "decision-support",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pypdf>=5.0",
    "alembic>=1.14",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "markitdown[pdf,docx,pptx,xlsx]==0.1.8",
]

[project.urls]
Homepage = "https://github.com/Hasnat26/industrial-rfq-intelligence"
Repository = "https://github.com/Hasnat26/industrial-rfq-intelligence"
Issues = "https://github.com/Hasnat26/industrial-rfq-intelligence/issues"

[project.optional-dependencies]
documents = [
    "markitdown==0.1.8",
]
ocr = [
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.13",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0,<7",
    "ruff>=0.6",
    "twine==7.0.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "zizmor==1.29.0",
]

[project.scripts]
industrial-rfq-intelligence = "freellmpool.cli:main"
freellmpool = "freellmpool.cli:main"
ffp = "freellmpool.cli:main"
industrial-rfq-api = "freellmpool.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/freellmpool"]

[tool.hatch.build.targets.wheel.force-include]
"src/freellmpool/providers.toml" = "freellmpool/providers.toml"
"src/freellmpool/capability_scores.json" = "freellmpool/capability_scores.json"
"src/freellmpool/task_evidence.json" = "freellmpool/task_evidence.json"
"src/freellmpool/recipes/second-opinion.json" = "freellmpool/recipes/second-opinion.json"
"src/freellmpool/recipes/pr-review.json" = "freellmpool/recipes/pr-review.json"
"src/freellmpool/recipes/repo-summary.json" = "freellmpool/recipes/repo-summary.json"
"src/freellmpool/recipes/launch-copy-critic.json" = "freellmpool/recipes/launch-copy-critic.json"
"src/freellmpool/recipes/metaswarm-worker-review.json" = "freellmpool/recipes/metaswarm-worker-review.json"

[tool.hatch.build.targets.sdist.force-include]
"src/freellmpool/recipes/second-opinion.json" = "src/freellmpool/recipes/second-opinion.json"
"src/freellmpool/recipes/pr-review.json" = "src/freellmpool/recipes/pr-review.json"
"src/freellmpool/recipes/repo-summary.json" = "src/freellmpool/recipes/repo-summary.json"
"src/freellmpool/recipes/launch-copy-critic.json" = "src/freellmpool/recipes/launch-copy-critic.json"
"src/freellmpool/recipes/metaswarm-worker-review.json" = "src/freellmpool/recipes/metaswarm-worker-review.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_document_normalizer.py",
    "tests/test_industrial_demo.py",
    "tests/test_industrial_report.py",
    "tests/test_security_config.py",
    "tests/test_release_config.py",
    "tests/test_ci_config.py",
    "tests/test_procurement_domain.py",
    "tests/test_api.py",
    "tests/test_rfq_revision_foundation.py",
    "tests/test_block1_technical_comparison.py",
    "tests/test_technical_clarification_loop.py",
    "tests/test_commercial.py",
    "tests/test_auth_tenant.py",
    "tests/test_migrations.py",
]
addopts = "-q"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
