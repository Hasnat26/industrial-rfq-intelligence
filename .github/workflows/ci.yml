name: CI
concurrency:
  group: industrial-rfq-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  industrial:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check Industrial RFQ modules
        run: |
          mypy --follow-imports=skip src/freellmpool/industrial.py src/freellmpool/industrial_report.py
          mypy src/freellmpool/api src/freellmpool/procurement_domain.py
      - name: Industrial CLI smoke
        run: |
          industrial-rfq-intelligence --version
          industrial-rfq-intelligence industrial-rfq --input examples/industrial_rfq/sample_input.json --json >/tmp/industrial-rfq.json
          industrial-rfq-intelligence industrial-rfq --input examples/industrial_rfq/sample_input.json --markdown >/tmp/industrial-rfq.md
          test -s /tmp/industrial-rfq.json
          test -s /tmp/industrial-rfq.md
      - name: Industrial RFQ tests
        run: |
          pytest
          pytest tests/test_industrial_demo.py tests/test_industrial_report.py tests/test_api.py tests/test_decision_support.py tests/test_engineering_decision.py tests/test_integrated_evaluation.py --cov=freellmpool.industrial --cov=freellmpool.industrial_report --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json
      - name: Build and wheel smoke
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m venv /tmp/industrial-rfq-wheel-smoke
          /tmp/industrial-rfq-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/industrial-rfq-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/industrial-rfq-wheel-smoke/bin/industrial-rfq-intelligence --version
          /tmp/industrial-rfq-wheel-smoke/bin/industrial-rfq-intelligence industrial-rfq --input examples/industrial_rfq/sample_input.json --markdown >/tmp/industrial-wheel-report.md
          test -s /tmp/industrial-wheel-report.md
          /tmp/industrial-rfq-wheel-smoke/bin/python -m pip uninstall --yes industrial-rfq-intelligence
          /tmp/industrial-rfq-wheel-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/industrial-rfq-wheel-smoke/bin/industrial-rfq-intelligence --version
          /tmp/industrial-rfq-wheel-smoke/bin/industrial-rfq-intelligence industrial-rfq --input examples/industrial_rfq/sample_input.json --markdown >/tmp/industrial-sdist-report.md
          test -s /tmp/industrial-sdist-report.md
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          unzip -l dist/*.whl | grep -q 'freellmpool/industrial.py'
          tar -tzf dist/*.tar.gz | grep -q 'industrial_rfq_intelligence-0.1.0/pyproject.toml'
